# Local quality gate. Install once per clone:
#   pip install pre-commit && pre-commit install
#
# These hooks run in seconds and catch the majority of review comments before
# a human ever reads the diff.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with pyproject.toml [project.optional-dependencies].dev —
    # both pin the same ruff version (see the pinning note there).
    rev: v0.16.5
    hooks:
      - id: ruff
        name: ruff (lint, autofix)
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff (format)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      # Catches the exact class of bug we hit: a name referenced but never
      # imported, silenced by a blanket `type: ignore`.
      - id: debug-statements
        name: no stray breakpoints

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (unit tests)
        entry: python -m pytest -q -m "not e2e"
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy (types)
        entry: mypy love_risk_engine
        language: system
        pass_filenames: false
        types: [python]
      # Safety net for House Rule #9 (no --no-verify). --no-verify skips
      # pre-commit but NOT pre-push. These re-run the full gate on push so a
      # bypassed commit is caught before it leaves the machine. Install with:
      #   pre-commit install --hook-type pre-push
      - id: push-ruff
        name: ruff check (on push)
        entry: ruff check .
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
      - id: push-ruff-format
        name: ruff format --check (on push)
        entry: ruff format --check .
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
      - id: push-mypy
        name: mypy (on push)
        entry: mypy love_risk_engine
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
      - id: push-pytest
        name: pytest (on push)
        entry: python -m pytest -q -m "not e2e"
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
