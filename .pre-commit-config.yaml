# Local quality gate. Install once per clone:
#   pip install pre-commit && pre-commit install
#
# These hooks run in seconds and catch the majority of review comments before
# a human ever reads the diff.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with pyproject.toml [project.optional-dependencies].dev —
    # both pin the same ruff version (see the pinning note there).
    rev: v0.16.5
    hooks:
      - id: ruff
        name: ruff (lint, autofix)
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff (format)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      # Catches the exact class of bug we hit: a name referenced but never
      # imported, silenced by a blanket `type: ignore`.
      - id: debug-statements
        name: no stray breakpoints

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (unit tests)
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy (types)
        entry: mypy love_risk_engine
        language: system
        pass_filenames: false
        types: [python]
