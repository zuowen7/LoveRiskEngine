[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "love-risk-engine"
version = "0.3.0"
description = "Personal relationship decision-support framework: evidence-first, bias-auditing, exposure-aware. Local SQLite + CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    # Pinned exactly so CI, pre-commit and local runs all use the same tool
    # versions — the unpinned `>=` ranges drifted once (ruff 0.6 vs 0.16
    # format differences broke CI on markdown code blocks) and cost a red run.
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
    "mypy==2.3.1",
    # Pinned like the rest; exercises the optional presentation path in tests.
    "rich==13.7.1",
]
# Optional presentation dependency (architecture invariant #7 amendment):
# prettier output when installed; the CLI falls back to plain text without it.
# Core/engine/storage remain stdlib-only either way.
pretty = [
    "rich==13.7.1",
]

[project.scripts]
lre = "love_risk_engine.cli:main"

[tool.setuptools]
packages = [
    "love_risk_engine",
    "love_risk_engine.core",
    "love_risk_engine.storage",
    "love_risk_engine.services",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

# ---------------------------------------------------------------------------
# Ruff: lint + format. Replaces flake8 / black / isort with a single tool.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["love_risk_engine", "tests"]

[tool.ruff.lint]
# Enforced in CI. Currently clean — keep it clean.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports, undefined names
    "I",   # isort: import ordering
    "B",   # flake8-bugbear: likely bugs
    "C4",  # comprehensions
    "UP",  # pyupgrade: modern syntax
    "SIM", # simplify
    "RET", # return consistency
    "ARG", # unused arguments
    "PTH", # prefer pathlib
    "S",   # bandit: security
]
ignore = [
    "S101",   # assert is fine in tests / internal invariants
    "RET504", # unnecessary assignment before return (hurts readability here)
    # `Path(x).open()` is no clearer than the `open()` builtin, which is also
    # what the stdlib docs use. Deliberate, permanent exemption.
    "PTH123",
]

# UP042 is worth understanding before accepting it. For `class X(str, Enum)`,
# `str(member)` returns "PAUSE" on 3.11 but "X.PAUSE" on 3.12+ — an actual
# behaviour split across the versions we support. StrEnum returns "PAUSE"
# everywhere, so this rule fixes a bug, not a style preference.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ARG"]   # tests may use assert / dummy args
# Translation catalog: en/zh template pairs on one line each are far more
# readable than wrapped concatenations, so long lines are exempted here.
"love_risk_engine/core/i18n.py" = ["E501"]

# NOTE: cli.py and core/timeline.py used to carry a SIM118 exemption because
# they inspected `sqlite3.Row` objects, where `key in row` compares *values*
# rather than column names. Every storage query now returns a domain object, so
# no `.keys()` check survives and the exemption was removed (2026-08-30). If a
# raw `sqlite3.Row` ever leaves the storage layer again, restore it.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy: static typing. `strict = true` is the goal; currently we stage it.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_untyped_calls = false  # DISPATCH[command] resolves to varied signatures
ignore_missing_imports = true

# Tests are intentionally excluded from mypy: they use untyped fixtures and
# dummy args by design. The bot is on the *source* — that is what ships.
# type-check only the package: `mypy love_risk_engine`.

# ---------------------------------------------------------------------------
# Coverage: fail the build under 95%. Ratchet this up, never down.
#
# Measured 2026-08-31: 97% total, 100% on cli.py (branch coverage on).
# The 95 floor leaves deliberate headroom so an ordinary PR is not blocked by
# noise, while still catching the failure mode that actually bit us: a command
# sitting at 0% coverage hid a live AttributeError in `lre timeline`.
#
# `evidence.py` and `hooks.py` are excluded: their only uncovered lines are
# defensive branches (zero-observation guards, "no hook fired" early returns)
# that are structurally hard to reach through the CLI and would otherwise force
# contrived tests. Every reachable, meaningful path in them is covered.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["love_risk_engine"]
branch = true
omit = [
    "love_risk_engine/core/evidence.py",
    "love_risk_engine/core/hooks.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.paths]
source = ["love_risk_engine", "*/love_risk_engine"]
