[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "love-risk-engine"
version = "0.1.0"
description = "Personal relationship decision-support framework: evidence-first, bias-auditing, exposure-aware. Local SQLite + CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
lre = "love_risk_engine.cli:main"

[tool.setuptools]
packages = [
    "love_risk_engine",
    "love_risk_engine.core",
    "love_risk_engine.storage",
    "love_risk_engine.services",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
