name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy love_risk_engine

      - name: Tests with coverage
        run: |
          python -m pytest --cov=love_risk_engine --cov-report=term-missing --cov-report=xml

      # Floor is mirrored in pyproject.toml ([tool.coverage.report] fail_under).
      - name: Enforce coverage floor
        run: |
          python -m coverage report --fail-under=95
